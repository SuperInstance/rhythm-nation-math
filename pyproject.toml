[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "rhythm-nation-math"
version = "0.1.0"
description = "The mathematics of rhythm — polyrhythms, polymeters, groove analysis, and syncopation metrics"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]
